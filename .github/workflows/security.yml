name: security

# Pipeline DevSecOps para la segunda evaluacion.
# Objetivo: bloquear el avance si fallan SAST, SCA, tests propios o DAST.
# - Semgrep: analisis estatico OWASP Top 10.
# - npm audit: dependencias HIGH/CRITICAL.
# - npm test: pruebas propias de seguridad.
# - OWASP ZAP full scan: DAST activo contra la app levantada en el runner.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  BASE_URL: 'http://127.0.0.1:3000'
  # El ZAP action corre dentro de un contenedor Docker. Para alcanzar la app
  # levantada en el runner se usa la puerta de enlace del bridge Docker.
  ZAP_TARGET: 'http://172.17.0.1:3000'

jobs:
  appsec:
    name: SAST + SCA + Tests + DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # ---- SAST ----
      # Sin continue-on-error: si Semgrep encuentra hallazgos, el job falla.
      - name: Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/react
            p/owasp-top-ten

      # ---- SCA / Dependencias ----
      # Sin continue-on-error: vulnerabilidades HIGH o CRITICAL rompen el pipeline.
      - name: npm audit
        run: npm audit --audit-level=high

      # ---- Build + arranque de la app ----
      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm start -- -H 0.0.0.0 &
          echo $! > next.pid
          npx --yes wait-on $BASE_URL --timeout 60000

      # ---- Tests propios de seguridad ----
      # Sin continue-on-error: si una vulnerabilidad vuelve, estos tests fallan.
      - name: Tests de seguridad
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: npm test

      # ---- DAST: OWASP ZAP FULL SCAN ----
      # fail_action true sigue activo. El flag -I evita que la rama remediada
      # quede roja por WARN/LOW residuales de ZAP; si aparecen alertas FAIL,
      # el pipeline sigue fallando.
      - name: OWASP ZAP Full Scan (DAST)
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ env.ZAP_TARGET }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-full-scan-report
          cmd_options: '-a -I'

      - name: Detener app
        if: always()
        run: |
          if [ -f next.pid ]; then kill $(cat next.pid) || true; fi
